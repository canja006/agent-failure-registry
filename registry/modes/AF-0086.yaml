id: AF-0086
title: "Insufficient sources"
status: stable
layer: model

description: >
  The agent commits to a conclusion on evidence too thin to support it,
  without gathering readily available additional sources.

symptoms:
  - "single source underpins a load-bearing claim"
  - "available search or read tools left unused"
  - "confidence in the final answer not matched by evidence in the trace"

discriminators:
  - "vs AF-0042: the sources read were interpreted correctly, there were just too few"
  - "vs AF-0077: the agent did not stop early; it concluded early"
  - "vs AF-0071: no sub-agent is involved; evidence was never gathered rather than gathered and dropped"
  - "vs AF-0153: too little evidence behind a conclusion, not a prescribed step left out"
  - "vs AF-0161: the claim is under-sourced, not invented; AF-0161 has no support at all"
  - "vs AF-0174: external evidence was left ungathered; in AF-0174 the agent's own store held the fact"

near_neighbors: [AF-0042, AF-0077, AF-0071, AF-0153, AF-0161, AF-0174]

references: []
examples:
  - "Magentic-One traj 0ec43718 (AgentRx ground truth): WebSurfer returns a partial list of gyms near the Mothman Museum and the Orchestrator concludes from it without verifying completeness"
