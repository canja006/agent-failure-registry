id: AF-0058
title: "Unproductive repetition"
status: provisional
layer: harness

description: >
  The agent retries the same action, or cycles a small set of actions,
  without the environment state or its own information changing between
  attempts.

symptoms:
  - "identical action repeated with identical arguments"
  - "step count grows while observable state is unchanged"
  - "no new information enters context between attempts"

discriminators:
  - "vs AF-0142: repetition here is of actions, not of reads"
  - "vs AF-0049: not scoped to a test/verify cycle"
  - "vs AF-0095: no policy or approval event in the trace; the repetition is unprompted"
  - "vs AF-0125: attempts are identical, not varied failing approaches"
  - "vs AF-0130: no quota or 429 errors in the trace; the repetition originates in the agent"

near_neighbors: [AF-0142, AF-0049, AF-0095, AF-0125, AF-0130]

references: []
examples: []
