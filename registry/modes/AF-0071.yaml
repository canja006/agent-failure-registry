id: AF-0071
title: "Delegation failure"
status: provisional
layer: harness

description: >
  A sub-agent or delegated call is dispatched with an incomplete or
  distorted brief, returns a result the parent cannot use, or its result is
  discarded without being incorporated.

symptoms:
  - "sub-agent brief omits constraints present in the parent task"
  - "sub-agent result not referenced in subsequent parent steps"
  - "parent re-does work the sub-agent already completed"

discriminators:
  - "vs AF-0088: the parent's plan is sound; the loss happens at the delegation boundary"
  - "vs AF-0086: information was gathered but not transferred"

near_neighbors: [AF-0088, AF-0086]

references: []
examples:
  - "Magentic-One traj 8b3379c0 (AgentRx ground truth): the Orchestrator's search brief to WebSurfer omits the key phrase 'Monterey Bay Aquarium', so the sub-agent cannot find the target video - the constraint was lost at the delegation boundary"
