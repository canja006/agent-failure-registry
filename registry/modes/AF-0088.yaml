id: AF-0088
title: "Plan/intent misalignment"
status: provisional
layer: model

description: >
  The agent constructs a plan, or routes to a sub-task, that does not serve
  the user's actual goal — solving an adjacent or reformulated problem
  instead.

symptoms:
  - "plan steps do not map onto stated goal criteria"
  - "agent optimises a proxy objective not requested"
  - "successful execution of the wrong task"

discriminators:
  - "vs AF-0103: the intent was clear enough to plan against"
  - "vs AF-0023: the plan is wrong, not the mechanics of a call"
  - "vs AF-0071: the plan itself is wrong; nothing is lost at a delegation boundary"
  - "vs AF-0153: the plan itself is wrong; AF-0153 has the right plan with one prescribed step missing"
  - "vs AF-0157: the goal is wrong; AF-0157 has the right goal and the wrong instrument for a step"
  - "vs AF-0166: the plan serves the wrong goal; AF-0166 serves the right goal with a surplus action"

near_neighbors: [AF-0103, AF-0023, AF-0071, AF-0153, AF-0157, AF-0166]

references: []
examples:
  - "Magentic-One (AgentRx ground truth): asked to compare price decreases between two trading cards, the Orchestrator instead pursues one card's ban date - a coherent plan for the wrong objective"
