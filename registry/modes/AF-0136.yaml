id: AF-0136
title: "Timeout"
status: provisional
layer: environment

description: >
  A step or the whole run exceeds its time budget and is cut off, leaving
  the task partially executed and the agent unaware of the boundary.

symptoms:
  - "run or step terminated by an external deadline"
  - "no completion signal in the trace"
  - "partial writes or half-applied state left behind"

discriminators:
  - "vs AF-0130: elapsed time rather than quota"
  - "vs AF-0077: termination is external, not the agent's decision"

near_neighbors: [AF-0130, AF-0077]

references: []
examples: []
