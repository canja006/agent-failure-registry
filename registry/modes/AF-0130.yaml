id: AF-0130
title: "Rate limit cascade"
status: provisional
layer: environment

description: >
  A throughput or quota limit triggers retries which themselves consume
  quota, degrading the run beyond the original limit.

symptoms:
  - "429 or quota errors clustering in time"
  - "retry rate increasing rather than backing off"
  - "unrelated later steps failing on exhausted quota"

discriminators:
  - "vs AF-0058: repetition is driven by the limit, not by the agent's reasoning"
  - "vs AF-0136: quota exhaustion rather than a time or step ceiling"
  - "vs AF-0118: the environment's state is unchanged; only its quota is exhausted"
  - "vs AF-0170: throttling with a 429/quota pattern, not a service that is down or unreachable"

near_neighbors: [AF-0058, AF-0136, AF-0118, AF-0170]

references: []
examples: []
