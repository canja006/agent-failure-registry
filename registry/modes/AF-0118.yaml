id: AF-0118
title: "Environment drift"
status: stable
layer: environment

description: >
  The environment changes underneath the agent mid-run — file contents,
  credentials, service versions, network state — and the agent continues
  acting on a stale model of it.

symptoms:
  - "read value differs from a previously read value with no agent write between"
  - "credential or session invalidated mid-run"
  - "dependency or service version changes between steps"

discriminators:
  - "vs AF-0142: the content genuinely changed here"
  - "vs AF-0130: drift is in state, not in throughput limits"
  - "vs AF-0149: the environment changed underneath the agent; a tool that fails against unchanged state is AF-0149"
  - "vs AF-0170: the target changed state; in AF-0170 it is unavailable"

near_neighbors: [AF-0142, AF-0130, AF-0149, AF-0170]

references: []
examples: []
