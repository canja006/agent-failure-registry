[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-failure-registry"   # PyPI name; the import and CLI are still `afr`
version = "0.1.0"
description = "Agent Failure Registry - a neutral namespace and crosswalk for AI agent failure modes"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
keywords = ["ai-agents", "failure-analysis", "taxonomy", "observability", "crosswalk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []          # deliberately empty - the index is compiled JSON

[project.optional-dependencies]
dev = ["pyyaml>=6.0"]      # required only to rebuild the index

[project.scripts]
afr = "afr.cli:main"

[tool.setuptools]
packages = ["afr"]

[tool.setuptools.package-data]
afr = ["_index.json"]
