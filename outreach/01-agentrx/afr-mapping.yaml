# Agent Failure Registry (AFR) mapping for AgentRx
# https://github.com/canja006/agent-failure-registry
#
# Maps AgentRx's categories onto AF-#### mode ids - a vendor-neutral
# namespace shared across agent failure taxonomies, so a failure profile
# from this tool can be compared with one from any other.
#
# Informational only. Nothing in AgentRx reads this file, and it adds
# no dependency. AFR does not ask AgentRx to change its taxonomy.
#
# `relation` describes the AF mode RELATIVE TO the AgentRx category:
#   exact    - same concept
#   narrower - the AF mode is narrower than this category
#   broader  - the AF mode is broader than this category
#   overlaps - partial; neither contains the other
#
# Generated from AFR index b2f6d166a2a2 on 2026-08-23.
# Corrections welcome as issues on the AFR repo.

afr_index: "b2f6d166a2a2"
source: agentrx

categories:
  "Guardrails Triggered":
    - id: AF-0095
      relation: narrower
      title: Guardrail block
    # GAP: the category is an RAI/safety-policy refusal OR an external site access restriction (CAPTCHA, login wall, 403, paywall, robots.txt). AF-0095 is the harness's own policy/approval gate and covers the first half; the external-access block is environment-layer and has no AF mode. Magentic's 9/44 here are a mix of Azure RAI filters and Cloudflare/CAPTCHA.
  "Instruction/Plan Adherence Failure":
    - id: AF-0153
      relation: narrower
      title: Required step omitted
    - id: AF-0166
      relation: narrower
      title: Unnecessary action
    - id: AF-0077
      relation: narrower
      title: Premature termination
    # Goal is correct (checklist Q1 excludes wrong-problem cases) but a step required by the plan, domain policy or orchestrator was skipped, reordered or padded with unneeded actions. AF splits it: under-execution (AF-0153, with stopping early AF-0077 as its own mode) and over-execution (AF-0166). The most common failure event in AgentRx's own annotations; this category is one of the sources for AF-0153 and AF-0166.
  "Intent Not Supported":
    - id: AF-0007
      relation: exact
      title: Intent not supported
    # Requested action needs a capability no available tool provides. In multi-agent runs the requester is often the orchestrator (FileSurfer asked to listen to audio) - same shape one level down.
  "Intent-Plan Misalignment":
    - id: AF-0088
      relation: exact
      title: Plan/intent misalignment
    # Wrong objective or key constraint violated because intent was misunderstood; checklist excludes missing-information and tool-error causes.
  "Invalid Invocation":
    - id: AF-0023
      relation: exact
      title: Invalid tool invocation
    # Explicit parse/validation/schema/syntax error for a concrete call; checklist excludes infra and access-block causes.
  "Invention of New Information":
    - id: AF-0161
      relation: narrower
      title: Fabricated content
    - id: AF-0011
      relation: narrower
      title: Fabricated tool signature
    # Fabricated facts and hallucinated state ('download succeeded') are AF-0161; fabricated tool/parameter schemas are AF-0011. The category also covers unjustified OMISSION of relevant information, which neither mode does - hence narrower, not exact. One of the sources for AF-0161.
  "Misinterpretation of Tool Output":
    - id: AF-0042
      relation: narrower
      title: Tool output misread
    - id: AF-0071
      relation: overlaps
      title: Delegation failure
    # Judge name is 'Misinterpretation of Tool Output / Handoff Failure': reasoning that contradicts, omits part of, or miscomputes from the agent's OWN OR ANOTHER AGENT's output. AF-0042 is the own-tool-output slice; a parent misusing a sub-agent's result is AF-0071's third symptom. 15/44 Magentic root causes are orchestrator-misreads-WebSurfer.
  "System Failure":
    - id: AF-0170
      relation: narrower
      title: External service failure
    - id: AF-0136
      relation: narrower
      title: Time or step budget exhausted
    - id: AF-0130
      relation: narrower
      title: Rate limit cascade
    - id: AF-0149
      relation: narrower
      title: Tool defect
    # Explicit infra/connectivity signal during a tool call - timeout, connection refused, DNS failure, endpoint unreachable, service unavailable, premature termination. AF splits it by mechanism: upstream service failure (AF-0170, listed first), time/step budget, rate-limit cascade, tool-internal error. 'Premature termination' of the run itself is the residue none of them names. Context truncation is not in the definition and is not mapped here. One of the sources for AF-0170.
  "Underspecified User Intent":
    - id: AF-0103
      relation: exact
      title: Underspecified intent
    # A specific required piece of information is absent from all evidence and the agent proceeded without it or failed to ask. AF-0103 describes the same failure from the 'picked a reading silently' side.

# Categories with no AF mode: residual labels and non-failures, left
# empty on purpose. Registry gaps - things this taxonomy names that AFR
# cannot yet name exactly - are marked GAP in the notes above; they are
# AFR's roadmap, not a judgement on the category.
unmapped:
  Inconclusive: "Residual label, not a failure mode. The judge must supply a free-text custom_category with it, so AgentRx output can carry labels outside the ten."
