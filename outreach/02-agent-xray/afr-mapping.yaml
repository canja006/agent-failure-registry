# Agent Failure Registry (AFR) mapping for Agent-Xray
# https://github.com/canja006/agent-failure-registry
#
# Maps Agent-Xray's categories onto AF-#### mode ids - a vendor-neutral
# namespace shared across agent failure taxonomies, so a failure profile
# from this tool can be compared with one from any other.
#
# Informational only. Nothing in Agent-Xray reads this file, and it adds
# no dependency. AFR does not ask Agent-Xray to change its taxonomy.
#
# `relation` describes the AF mode RELATIVE TO the Agent-Xray category:
#   exact    - same concept
#   narrower - the AF mode is narrower than this category
#   broader  - the AF mode is broader than this category
#   overlaps - partial; neither contains the other
#
# Generated from AFR index ae6acc1fab99 on 2026-08-23.
# Corrections welcome as issues on the AFR repo.

afr_index: "ae6acc1fab99"
source: agent-xray

categories:
  approval_block:
    - id: AF-0095
      relation: exact
      title: Guardrail block
  context_overflow:
    - id: AF-0064
      relation: exact
      title: Context overflow truncation
  delegation_failure:
    - id: AF-0071
      relation: exact
      title: Delegation failure
  early_abort:
    - id: AF-0077
      relation: exact
      title: Premature termination
  environment_drift:
    - id: AF-0118
      relation: exact
      title: Environment drift
  insufficient_sources:
    - id: AF-0086
      relation: exact
      title: Insufficient sources
  memory_overload:
    - id: AF-0064
      relation: overlaps
      title: Context overflow truncation
  model_limit:
    - id: AF-0125
      relation: exact
      title: Model capability limit
  prompt_bug:
    - id: AF-0103
      relation: overlaps
      title: Underspecified intent
  rate_limit_cascade:
    - id: AF-0130
      relation: exact
      title: Rate limit cascade
  reasoning_bug:
    - id: AF-0042
      relation: overlaps
      title: Tool output misread
    - id: AF-0125
      relation: overlaps
      title: Model capability limit
    # Broad; overlaps both misreading output and hitting a capability ceiling.
  routing_bug:
    - id: AF-0088
      relation: overlaps
      title: Plan/intent misalignment
  spin:
    - id: AF-0058
      relation: overlaps
      title: Unproductive repetition
  stuck_loop:
    - id: AF-0058
      relation: exact
      title: Unproductive repetition
  test_failure_loop:
    - id: AF-0049
      relation: exact
      title: Test failure loop
  timeout:
    - id: AF-0136
      relation: exact
      title: Timeout
  tool_rejection_mismatch:
    - id: AF-0095
      relation: overlaps
      title: Guardrail block
  tool_selection_bug:
    - id: AF-0088
      relation: overlaps
      title: Plan/intent misalignment
    - id: AF-0023
      relation: overlaps
      title: Invalid tool invocation
    # Wrong-tool-chosen sits between planning and invocation; deliberately not exact to either.

# Categories with no AF mode. Three different things:
#   - residual labels and non-failures (correct to leave empty)
#   - genuine registry gaps, marked GAP - these are AFR's roadmap
unmapped:
  consultative_success: "Not a failure."
  tool_bug: "GAP: tool-layer defect (the tool itself is broken). No AF mode yet - candidate for the tool layer."
  unclassified: "Residual label."
  valid_alternative_path: "Not a failure."
